name: Sonar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sonar:
    runs-on: ubuntu-latest
    # Forked PRs don't get repo secrets under the pull_request trigger, so SONAR_TOKEN
    # wouldn't be available; skip analysis there rather than fail on a missing secret.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # Without this the scan step exits as soon as results upload, before the
          # Quality Gate is even computed — this job would report success regardless
          # of the actual analysis outcome.
          args: -Dsonar.qualitygate.wait=true
